# Pings the live game so Render's free plan doesn't put it to sleep.
# GitHub runs scheduled jobs roughly every 10 minutes (timing is best-effort).
# Note: GitHub pauses scheduled workflows after 60 days without repo activity;
# re-enable it from the Actions tab if that happens.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://red-string-7n2s.onrender.com/api/health
